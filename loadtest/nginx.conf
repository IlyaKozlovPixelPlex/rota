worker_processes auto;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    # Minimal TLS destination for load testing. Returns a tiny body so the
    # measurement reflects rota's tunnel-establishment overhead, not the
    # destination's response cost.
    server {
        listen 443 ssl backlog=8192 reuseport;
        http2 on;
        server_name rota-lt-nginx;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Keep the handshake cheap and deterministic.
        ssl_session_cache   shared:SSL:10m;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
